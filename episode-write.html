<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>새 회차 작성 - NOVEL</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>

<body>

<header>
    <div class="header-inner">

        <a href="index.html" class="logo">
            NOVEL
        </a>

        <nav>
            <a href="novels.html">소설</a>
            <a href="#">검색</a>
        </nav>

        <div class="header-right">
            <a href="writer.html">작가 페이지</a>
        </div>

    </div>
</header>


<main class="write-page">

    <div class="write-box">

        <p class="write-small">
            NEW EPISODE
        </p>

        <h1>새 회차 작성</h1>


        <div id="novel-info">
            작품 정보를 불러오는 중...
        </div>


        <form id="episode-form">

            <div class="write-field">

                <label for="episode-number">
                    회차 번호
                </label>

                <input
                    type="number"
                    id="episode-number"
                    min="1"
                    required
                    placeholder="예: 1">

            </div>


            <div class="write-field">

                <label for="episode-title">
                    회차 제목
                </label>

                <input
                    type="text"
                    id="episode-title"
                    required
                    placeholder="예: 새로운 시작">

            </div>


            <div class="write-field">

                <label for="episode-content">
                    본문
                </label>

                <textarea
                    id="episode-content"
                    rows="25"
                    required
                    placeholder="회차 본문을 입력하세요"></textarea>

            </div>


            <div class="edit-buttons">

                <a
                    id="cancel-button"
                    href="writer.html"
                    class="edit-cancel-button">
                    취소
                </a>

                <button
                    type="submit"
                    id="save-button">
                    회차 저장
                </button>

            </div>

        </form>

    </div>

</main>


<script>

let novelId = null;


// URL에서 작품 ID 가져오기
function getNovelId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("novel_id");
}


// 작품 정보 불러오기
async function loadNovel() {

    const userResult =
        await supabaseClient.auth.getUser();

    const user =
        userResult.data.user;


    if (!user) {

        window.location.href =
            "login.html";

        return;
    }


    novelId =
        getNovelId();


    if (!novelId) {

        alert(
            "작품 정보를 찾을 수 없습니다."
        );

        window.location.href =
            "writer.html";

        return;
    }


    const result =
        await supabaseClient
            .from("novels")
            .select(
                "id, title, author_id"
            )
            .eq("id", novelId)
            .eq("author_id", user.id)
            .single();


    if (result.error) {

        console.error(
            "작품 확인 오류:",
            result.error
        );

        alert(
            "해당 작품을 확인할 수 없습니다."
        );

        window.location.href =
            "writer.html";

        return;
    }


    const novel =
        result.data;


    document.getElementById(
        "novel-info"
    ).innerHTML = `
        <div class="episode-novel-info">
            <span>작품</span>
            <strong>
                ${escapeHTML(novel.title)}
            </strong>
        </div>
    `;


    // 가장 최근 회차 번호 확인
    const episodeResult =
        await supabaseClient
            .from("novel_episodes")
            .select("episode_number")
            .eq("novel_id", novelId)
            .order(
                "episode_number",
                {
                    ascending: false
                }
            )
            .limit(1);


    if (
        !episodeResult.error &&
        episodeResult.data.length > 0
    ) {

        const lastNumber =
            episodeResult.data[0]
                .episode_number;


        document.getElementById(
            "episode-number"
        ).value =
            lastNumber + 1;

    } else {

        document.getElementById(
            "episode-number"
        ).value = 1;

    }


    // 취소 버튼도 회차 관리 페이지로 연결
    document.getElementById(
        "cancel-button"
    ).href =
        "episode.html?novel_id=" +
        novelId;

}


// 회차 저장
document.getElementById(
    "episode-form"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const episodeNumber =
            Number(
                document.getElementById(
                    "episode-number"
                ).value
            );


        const title =
            document.getElementById(
                "episode-title"
            ).value.trim();


        const content =
            document.getElementById(
                "episode-content"
            ).value.trim();


        if (
            !episodeNumber ||
            episodeNumber < 1
        ) {

            alert(
                "올바른 회차 번호를 입력해주세요."
            );

            return;
        }


        if (!title) {

            alert(
                "회차 제목을 입력해주세요."
            );

            return;
        }


        if (!content) {

            alert(
                "본문을 입력해주세요."
            );

            return;
        }


        const saveButton =
            document.getElementById(
                "save-button"
            );


        saveButton.disabled = true;

        saveButton.textContent =
            "저장 중...";


        const result =
            await supabaseClient
                .from("novel_episodes")
                .insert({

                    novel_id: novelId,

                    episode_number:
                        episodeNumber,

                    title: title,

                    content: content

                });


        if (result.error) {

            console.error(
                "회차 저장 오류:",
                result.error
            );


            if (
                result.error.code ===
                "23505"
            ) {

                alert(
                    "이미 존재하는 회차 번호입니다.\n\n" +
                    "다른 회차 번호를 입력해주세요."
                );

            } else {

                alert(
                    "회차 저장에 실패했습니다.\n\n" +
                    result.error.message
                );

            }


            saveButton.disabled = false;

            saveButton.textContent =
                "회차 저장";

            return;
        }


        alert(
            episodeNumber +
            "화가 등록되었습니다!"
        );


        window.location.href =
            "episode.html?novel_id=" +
            novelId;

    }
);


// HTML 특수문자 처리
function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// 시작
loadNovel();

</script>

</body>
</html>
