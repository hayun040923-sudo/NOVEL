<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자 - NOVEL</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>

<body>

<header>
    <div class="header-inner">

        <a href="index.html" class="logo">
            NOVEL
        </a>

        <nav>
            <a href="novels.html">소설</a>
            <a href="#">인기작</a>
            <a href="#">최신작</a>
        </nav>

        <div class="header-right">
            <a href="account.html">내 계정</a>
        </div>

    </div>
</header>


<main class="admin-page">

    <div class="admin-box">

        <p class="account-small">
            ADMIN
        </p>

        <h1>관리자 페이지</h1>

        <section class="admin-section">

            <div class="admin-section-title">
                <div>
                    <p class="section-small">WRITER APPLICATIONS</p>
                    <h2>작가 신청 관리</h2>
                </div>
            </div>

            <div id="application-list">
                신청 목록을 불러오는 중...
            </div>

        </section>

    </div>

</main>


<script>

async function checkAdmin() {

    // 현재 로그인한 사용자 확인
    const userResult =
        await supabaseClient.auth.getUser();

    const user =
        userResult.data.user;


    // 로그인하지 않았다면
    if (!user) {
        window.location.href = "login.html";
        return null;
    }


    // profiles에서 관리자 여부 확인
    const profileResult =
        await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .single();


    if (profileResult.error) {

        alert("관리자 정보를 확인할 수 없습니다.");
        window.location.href = "index.html";

        return null;
    }


    // 관리자가 아니라면 접근 차단
    if (profileResult.data.role !== "admin") {

        alert("관리자만 접근할 수 있습니다.");
        window.location.href = "index.html";

        return null;
    }


    return user;
}


async function loadApplications() {

    const list =
        document.getElementById("application-list");


    const result =
        await supabaseClient
            .from("profiles")
            .select("id, email, nickname, writer_status, created_at")
            .eq("writer_status", "pending")
            .order("created_at", {
                ascending: true
            });


    if (result.error) {

        console.error(result.error);

        list.innerHTML = `
            <p class="admin-error">
                신청 목록을 불러오지 못했습니다.
            </p>
        `;

        return;
    }


    const applications =
        result.data;


    // 신청자가 없는 경우
    if (applications.length === 0) {

        list.innerHTML = `
            <div class="empty-applications">
                현재 작가 신청이 없습니다.
            </div>
        `;

        return;
    }


    list.innerHTML = "";


    applications.forEach((profile) => {

        const item =
            document.createElement("div");

        item.className =
            "application-item";


        item.innerHTML = `

            <div class="application-info">

                <strong>
                    ${profile.nickname}
                </strong>

                <span>
                    ${profile.email}
                </span>

            </div>

            <div class="application-actions">

                <button
                    class="approve-button"
                    data-id="${profile.id}">
                    승인
                </button>

                <button
                    class="reject-button"
                    data-id="${profile.id}">
                    거절
                </button>

            </div>

        `;


        list.appendChild(item);

    });


    // 승인 버튼
    document
        .querySelectorAll(".approve-button")
        .forEach((button) => {

            button.addEventListener(
                "click",
                () => approveWriter(button.dataset.id)
            );

        });


    // 거절 버튼
    document
        .querySelectorAll(".reject-button")
        .forEach((button) => {

            button.addEventListener(
                "click",
                () => rejectWriter(button.dataset.id)
            );

        });

}


async function approveWriter(profileId) {

    const confirmed =
        confirm("이 회원을 작가로 승인하시겠습니까?");


    if (!confirmed) {
        return;
    }


    const result =
        await supabaseClient.rpc(
            "approve_writer",
            {
                target_user_id: profileId
            }
        );


    if (result.error) {

        console.error(result.error);

        alert(
            "승인에 실패했습니다.\n\n"
            + result.error.message
        );

        return;
    }


    alert("작가 승인이 완료되었습니다.");

    loadApplications();

}


async function rejectWriter(profileId) {

    const confirmed =
        confirm("이 작가 신청을 거절하시겠습니까?");


    if (!confirmed) {
        return;
    }


    const result =
        await supabaseClient.rpc(
            "reject_writer",
            {
                target_user_id: profileId
            }
        );


    if (result.error) {

        console.error(result.error);

        alert(
            "거절에 실패했습니다.\n\n"
            + result.error.message
        );

        return;
    }


    alert("작가 신청을 거절했습니다.");

    loadApplications();

}


// 페이지 시작
async function startAdminPage() {

    const user =
        await checkAdmin();


    if (!user) {
        return;
    }


    await loadApplications();

}


startAdminPage();

</script>

</body>
</html>
