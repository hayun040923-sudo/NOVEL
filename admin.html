<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자 페이지 - NOVEL</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>


<body>


<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            NOVEL
        </a>


        <nav>

            <a href="novels.html">
                소설
            </a>

            <a href="search.html">
                검색
            </a>

        </nav>


        <div class="header-right">

            <a href="account.html">
                내 계정
            </a>

        </div>

    </div>

</header>



<main class="admin-page">

    <div class="admin-box">


        <!-- 페이지 제목 -->

        <div class="admin-header">

            <p class="admin-small">
                ADMIN
            </p>

            <h1>
                관리자 페이지
            </h1>

            <p class="admin-description">
                NOVEL 사이트의 작가 신청과 사이트 통계를 관리할 수 있습니다.
            </p>

        </div>



        <!-- 사이트 통계 -->

        <section class="admin-section">


            <div class="admin-section-header">

                <div>

                    <p class="admin-section-small">
                        SITE STATISTICS
                    </p>

                    <h2>
                        사이트 통계
                    </h2>

                    <p class="admin-section-description">
                        NOVEL 사이트의 접속 및 회원 통계를 확인할 수 있습니다.
                    </p>

                </div>

            </div>



            <div class="site-statistics">


                <!-- 총 접속 횟수 -->

                <div class="stat-card">

                    <div class="stat-card-label">
                        총 접속 횟수
                    </div>

                    <div
                        id="total-visits"
                        class="stat-card-number">
                        -
                    </div>

                    <div class="stat-card-description">
                        지금까지 기록된 전체 방문
                    </div>

                </div>



                <!-- 오늘 접속 -->

                <div class="stat-card">

                    <div class="stat-card-label">
                        오늘 접속
                    </div>

                    <div
                        id="today-visits"
                        class="stat-card-number">
                        -
                    </div>

                    <div class="stat-card-description">
                        오늘 기록된 방문
                    </div>

                </div>



                <!-- 고유 방문자 -->

                <div class="stat-card">

                    <div class="stat-card-label">
                        고유 방문자
                    </div>

                    <div
                        id="unique-visitors"
                        class="stat-card-number">
                        -
                    </div>

                    <div class="stat-card-description">
                        서로 다른 방문자
                    </div>

                </div>



                <!-- 가입자 -->

                <div class="stat-card">

                    <div class="stat-card-label">
                        가입 회원
                    </div>

                    <div
                        id="total-users"
                        class="stat-card-number">
                        -
                    </div>

                    <div class="stat-card-description">
                        현재 가입된 회원
                    </div>

                </div>


            </div>


        </section>



        <!-- 작가 신청 관리 -->

        <section class="admin-section">


            <div class="admin-section-header">

                <div>

                    <p class="admin-section-small">
                        WRITER APPLICATIONS
                    </p>

                    <h2>
                        작가 신청 관리
                    </h2>

                    <p class="admin-section-description">
                        작가 권한을 신청한 회원을 확인하고 승인할 수 있습니다.
                    </p>

                </div>

            </div>



            <!-- 신청 목록 -->

            <div
                id="application-list"
                class="application-list">

                <div class="application-loading">
                    신청 목록을 불러오는 중입니다...
                </div>

            </div>


        </section>


    </div>

</main>



<script>


/*
    관리자 권한 확인
*/

async function checkAdmin() {

    const userResult =
        await supabaseClient.auth.getUser();

    const user =
        userResult.data.user;


    // 로그인하지 않은 경우

    if (!user) {

        window.location.href =
            "login.html";

        return null;
    }


    // 관리자 여부 확인

    const profileResult =
        await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .single();


    if (profileResult.error) {

        console.error(
            "관리자 확인 오류:",
            profileResult.error
        );

        alert(
            "관리자 정보를 확인할 수 없습니다."
        );

        window.location.href =
            "index.html";

        return null;
    }


    // 관리자가 아닌 경우

    if (
        profileResult.data.role !== "admin"
    ) {

        alert(
            "관리자만 접근할 수 있습니다."
        );

        window.location.href =
            "index.html";

        return null;
    }


    return user;
}



/*
    사이트 통계 불러오기
*/

async function loadSiteStatistics() {

    const totalVisits =
        document.getElementById(
            "total-visits"
        );

    const todayVisits =
        document.getElementById(
            "today-visits"
        );

    const uniqueVisitors =
        document.getElementById(
            "unique-visitors"
        );

    const totalUsers =
        document.getElementById(
            "total-users"
        );


    const result =
        await supabaseClient.rpc(
            "get_site_statistics"
        );


    if (result.error) {

        console.error(
            "사이트 통계 오류:",
            result.error
        );


        totalVisits.textContent = "-";
        todayVisits.textContent = "-";
        uniqueVisitors.textContent = "-";
        totalUsers.textContent = "-";


        return;
    }


    const statistics =
        result.data[0];


    if (!statistics) {
        return;
    }


    totalVisits.textContent =
        Number(
            statistics.total_visits
        ).toLocaleString("ko-KR");


    todayVisits.textContent =
        Number(
            statistics.today_visits
        ).toLocaleString("ko-KR");


    uniqueVisitors.textContent =
        Number(
            statistics.total_unique_visitors
        ).toLocaleString("ko-KR");


    totalUsers.textContent =
        Number(
            statistics.total_users
        ).toLocaleString("ko-KR");

}



/*
    작가 신청 목록 불러오기
*/

async function loadApplications() {

    const list =
        document.getElementById(
            "application-list"
        );


    const result =
        await supabaseClient
            .from("profiles")
            .select(
                "id, email, nickname, writer_status, created_at"
            )
            .eq(
                "writer_status",
                "pending"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    // 오류 처리

    if (result.error) {

        console.error(
            "신청 목록 오류:",
            result.error
        );

        list.innerHTML = `

            <div class="application-error">

                <strong>
                    신청 목록을 불러오지 못했습니다.
                </strong>

                <p>
                    잠시 후 다시 시도해주세요.
                </p>

            </div>

        `;

        return;
    }


    const applications =
        result.data;


    // 신청자가 없는 경우

    if (
        applications.length === 0
    ) {

        list.innerHTML = `

            <div class="application-empty">

                <div class="application-empty-icon">
                    ✓
                </div>

                <strong>
                    현재 작가 신청이 없습니다.
                </strong>

                <p>
                    새로운 작가 신청이 들어오면 이곳에 표시됩니다.
                </p>

            </div>

        `;

        return;
    }


    // 목록 초기화

    list.innerHTML = "";


    // 신청자 하나씩 표시

    applications.forEach(
        function(profile) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "application-item";


            const date =
                new Date(
                    profile.created_at
                ).toLocaleDateString(
                    "ko-KR"
                );


            item.innerHTML = `

                <div class="application-info">

                    <div class="application-user">

                        <div class="application-avatar">
                            ${profile.nickname.charAt(0)}
                        </div>

                        <div class="application-user-text">

                            <strong>
                                ${profile.nickname}
                            </strong>

                            <span>
                                ${profile.email}
                            </span>

                        </div>

                    </div>


                    <div class="application-date">

                        신청일

                        <strong>
                            ${date}
                        </strong>

                    </div>

                </div>


                <div class="application-actions">

                    <button
                        type="button"
                        class="approve-button"
                        data-id="${profile.id}">

                        승인

                    </button>


                    <button
                        type="button"
                        class="reject-button"
                        data-id="${profile.id}">

                        거절

                    </button>

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );


    /*
        승인 버튼
    */

    document
        .querySelectorAll(
            ".approve-button"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        approveWriter(
                            button.dataset.id
                        );

                    }
                );

            }
        );


    /*
        거절 버튼
    */

    document
        .querySelectorAll(
            ".reject-button"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        rejectWriter(
                            button.dataset.id
                        );

                    }
                );

            }
        );

}



/*
    작가 승인
*/

async function approveWriter(
    profileId
) {

    const confirmed =
        confirm(
            "이 회원을 작가로 승인하시겠습니까?"
        );


    if (!confirmed) {
        return;
    }


    const result =
        await supabaseClient.rpc(
            "approve_writer",
            {
                target_user_id:
                    profileId
            }
        );


    if (result.error) {

        console.error(
            "작가 승인 오류:",
            result.error
        );

        alert(
            "승인에 실패했습니다.\n\n" +
            result.error.message
        );

        return;
    }


    alert(
        "작가 승인이 완료되었습니다."
    );


    await loadApplications();

}



/*
    작가 신청 거절
*/

async function rejectWriter(
    profileId
) {

    const confirmed =
        confirm(
            "이 작가 신청을 거절하시겠습니까?"
        );


    if (!confirmed) {
        return;
    }


    const result =
        await supabaseClient.rpc(
            "reject_writer",
            {
                target_user_id:
                    profileId
            }
        );


    if (result.error) {

        console.error(
            "작가 거절 오류:",
            result.error
        );

        alert(
            "거절에 실패했습니다.\n\n" +
            result.error.message
        );

        return;
    }


    alert(
        "작가 신청을 거절했습니다."
    );


    await loadApplications();

}



/*
    관리자 페이지 시작
*/

async function startAdminPage() {

    const user =
        await checkAdmin();


    if (!user) {
        return;
    }


    // 사이트 통계

    await loadSiteStatistics();


    // 작가 신청 목록

    await loadApplications();

}


startAdminPage();


</script>


</body>

</html>
