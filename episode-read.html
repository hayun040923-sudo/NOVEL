<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>회차 읽기 - NOVEL</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/supabase.js"></script>

</head>


<body>


<!-- ========================================
     헤더
======================================== -->

<header>

    <div class="header-inner">

        <a
            href="index.html"
            class="logo"
        >
            NOVEL
        </a>


        <nav>

            <a href="novels.html">
                소설
            </a>

            <a href="search.html">
                검색
            </a>

        </nav>


        <div class="header-right">

            <a href="index.html">
                홈
            </a>

        </div>

    </div>

</header>



<!-- ========================================
     회차 본문
======================================== -->

<main class="episode-read-page">

    <div class="episode-read-box">


        <!-- 작품 제목 -->

        <a
            id="novel-title"
            href="#"
            class="episode-read-novel-title"
        >
            작품을 불러오는 중...
        </a>


        <!-- 회차 제목 -->

        <div class="episode-read-header">

            <span
                id="episode-number"
                class="episode-read-number"
            >
                -
            </span>


            <h1 id="episode-title">
                회차를 불러오는 중...
            </h1>


            <p
                id="episode-date"
                class="episode-read-date"
            >
            </p>

        </div>


        <!-- 본문 -->

        <article
            id="episode-content"
            class="episode-read-content"
        >
            본문을 불러오는 중...
        </article>


        <!-- ========================================
             이전 / 목록 / 다음
        ======================================== -->

        <div class="episode-navigation">

            <a
                id="previous-episode"
                href="#"
                class="episode-nav-button"
            >
                ← 이전 화
            </a>


            <a
                id="episode-list"
                href="#"
                class="episode-nav-button episode-list-button"
            >
                회차 목록
            </a>


            <a
                id="next-episode"
                href="#"
                class="episode-nav-button"
            >
                다음 화 →
            </a>

        </div>


        <!-- ========================================
             댓글
        ======================================== -->

        <section class="episode-comments-section">


            <div class="episode-comments-header">

                <div>

                    <span class="episode-comments-small">
                        COMMENTS
                    </span>

                    <h2>
                        댓글
                    </h2>

                </div>


                <span
                    id="comment-count"
                    class="episode-comment-count"
                >
                    0개
                </span>

            </div>



            <!-- ====================================
                 댓글 작성
            ===================================== -->

            <div
                id="comment-form-area"
                class="episode-comment-form-area"
            >

                <textarea
                    id="comment-input"
                    class="episode-comment-input"
                    placeholder="댓글을 입력해주세요."
                    maxlength="1000"
                ></textarea>


                <div class="episode-comment-form-bottom">

                    <span class="episode-comment-limit">
                        최대 1000자
                    </span>


                    <button
                        type="button"
                        id="comment-submit-button"
                        class="episode-comment-submit"
                        onclick="submitComment()"
                    >
                        댓글 등록
                    </button>

                </div>

            </div>



            <!-- ====================================
                 로그인하지 않은 경우
            ===================================== -->

            <div
                id="comment-login-message"
                class="episode-comment-login-message"
                style="display:none;"
            >

                댓글을 작성하려면
                <a href="login.html">
                    로그인하세요.
                </a>

            </div>



            <!-- ====================================
                 댓글 목록
            ===================================== -->

            <div
                id="episode-comments"
                class="episode-comments-list"
            >

                <p class="episode-comments-loading">
                    댓글을 불러오는 중...
                </p>

            </div>


        </section>


    </div>

</main>



<script>


// ========================================
// 현재 회차 ID
// ========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const episodeId =
    params.get("id");



// ========================================
// 현재 로그인 사용자
// ========================================

let currentUser = null;



// ========================================
// 댓글 좋아요 처리 중인 댓글
// ========================================

const likingComments =
    new Set();



// ========================================
// HTML 특수문자 처리
// ========================================

function escapeHTML(text) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }


    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



// ========================================
// 현재 로그인 사용자 확인
// ========================================

async function loadCurrentUser() {

    const result =
        await supabaseClient.auth.getUser();


    if (result.error) {

        console.error(
            "사용자 확인 오류:",
            result.error
        );

        currentUser = null;

        return;

    }


    currentUser =
        result.data.user || null;


    updateCommentForm();

}



// ========================================
// 댓글 작성창 상태 업데이트
// ========================================

function updateCommentForm() {

    const formArea =
        document.getElementById(
            "comment-form-area"
        );


    const loginMessage =
        document.getElementById(
            "comment-login-message"
        );


    if (!formArea || !loginMessage) {

        return;

    }



    if (currentUser) {

        formArea.style.display =
            "block";

        loginMessage.style.display =
            "none";

    } else {

        formArea.style.display =
            "none";

        loginMessage.style.display =
            "block";

    }

}



// ========================================
// 댓글 좋아요 데이터 가져오기
// ========================================

async function loadCommentLikes(
    commentIds
) {

    const likesMap = {};


    // 댓글이 없으면 종료

    if (
        !commentIds ||
        commentIds.length === 0
    ) {

        return likesMap;

    }


    const result =
        await supabaseClient
            .from("comment_likes")
            .select(
                "comment_id, user_id"
            )
            .in(
                "comment_id",
                commentIds
            );


    if (result.error) {

        console.error(
            "댓글 좋아요 불러오기 오류:",
            result.error
        );


        return likesMap;

    }


    const likes =
        result.data || [];


    likes.forEach(
        function (like) {

            if (
                !likesMap[like.comment_id]
            ) {

                likesMap[like.comment_id] = {
                    count: 0,
                    likedByMe: false
                };

            }


            likesMap[like.comment_id].count++;


            if (
                currentUser &&
                like.user_id === currentUser.id
            ) {

                likesMap[
                    like.comment_id
                ].likedByMe = true;

            }

        }
    );


    return likesMap;

}



// ========================================
// 댓글 불러오기
// ========================================

async function loadComments() {

    const commentList =
        document.getElementById(
            "episode-comments"
        );


    const commentCount =
        document.getElementById(
            "comment-count"
        );


    if (!episodeId) {

        return;

    }



    const result =
        await supabaseClient.rpc(
            "get_episode_comments",
            {
                target_episode_id:
                    episodeId
            }
        );



    if (result.error) {

        console.error(
            "댓글 불러오기 오류:",
            result.error
        );


        commentList.innerHTML = `

            <div class="episode-comments-error">

                댓글을 불러오지 못했습니다.

            </div>

        `;

        return;

    }



    const comments =
        result.data || [];



    commentCount.textContent =
        comments.length + "개";



    // =====================================
    // 댓글이 없는 경우
    // =====================================

    if (comments.length === 0) {

        commentList.innerHTML = `

            <div class="episode-comments-empty">

                아직 댓글이 없습니다.

                <span>
                    첫 번째 댓글을 남겨보세요.
                </span>

            </div>

        `;

        return;

    }



    // =====================================
    // 댓글 ID 가져오기
    // =====================================

    const commentIds =
        comments.map(
            function (comment) {

                return comment.id;

            }
        );



    // =====================================
    // 좋아요 데이터 가져오기
    // =====================================

    const likesMap =
        await loadCommentLikes(
            commentIds
        );



    // =====================================
    // 댓글 출력
    // =====================================

    let html = "";



    comments.forEach(
        function (comment) {

            const date =
                new Date(
                    comment.created_at
                ).toLocaleString(
                    "ko-KR",
                    {
                        year: "numeric",
                        month: "2-digit",
                        day: "2-digit",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            const isMine =
                currentUser &&
                currentUser.id ===
                    comment.user_id;



            // =================================
            // 좋아요 정보
            // =================================

            const likeInfo =
                likesMap[comment.id] || {
                    count: 0,
                    likedByMe: false
                };


            const likeCount =
                likeInfo.count;


            const likedByMe =
                likeInfo.likedByMe;



            html += `

                <div
                    class="episode-comment-item"
                >


                    <div
                        class="episode-comment-header"
                    >

                        <div
                            class="episode-comment-user"
                        >

                            <div
                                class="episode-comment-avatar"
                            >
                                ${escapeHTML(
                                    (
                                        comment.nickname ||
                                        "?"
                                    ).charAt(0)
                                )}
                            </div>


                            <strong>

                                ${escapeHTML(
                                    comment.nickname ||
                                    "알 수 없는 사용자"
                                )}

                            </strong>

                        </div>


                        <span
                            class="episode-comment-date"
                        >

                            ${date}

                        </span>

                    </div>


                    <div
                        class="episode-comment-content"
                    >

                        ${escapeHTML(
                            comment.content
                        ).replace(
                            /\n/g,
                            "<br>"
                        )}

                    </div>


                    <!-- =================================
                         댓글 하단 버튼
                    ================================== -->

                    <div
                        class="episode-comment-actions"
                    >


                        <!-- 좋아요 -->

                        <button
                            type="button"
                            class="episode-comment-like ${
                                likedByMe
                                    ? "liked"
                                    : ""
                            }"
                            id="comment-like-${comment.id}"
                            onclick="toggleCommentLike('${comment.id}')"
                        >

                            <span class="comment-like-icon">

                                ${
                                    likedByMe
                                        ? "❤️"
                                        : "♡"
                                }

                            </span>


                            <span
                                class="comment-like-count"
                                id="comment-like-count-${comment.id}"
                            >
                                ${likeCount}
                            </span>

                        </button>


                        ${
                            isMine
                            ? `

                                <button
                                    type="button"
                                    class="episode-comment-delete"
                                    onclick="deleteComment('${comment.id}')"
                                >
                                    삭제
                                </button>

                            `
                            : ""
                        }

                    </div>


                </div>

            `;

        }
    );



    commentList.innerHTML =
        html;

}



// ========================================
// 댓글 좋아요 / 취소
// ========================================

async function toggleCommentLike(
    commentId
) {

    // ----------------------------------------
    // 로그인 확인
    // ----------------------------------------

    if (!currentUser) {

        alert(
            "좋아요를 누르려면 로그인하세요."
        );

        return;

    }


    // ----------------------------------------
    // 중복 클릭 방지
    // ----------------------------------------

    if (
        likingComments.has(commentId)
    ) {

        return;

    }


    likingComments.add(
        commentId
    );


    const button =
        document.getElementById(
            "comment-like-" +
            commentId
        );


    const countElement =
        document.getElementById(
            "comment-like-count-" +
            commentId
        );


    try {

        // ====================================
        // 현재 좋아요 여부 확인
        // ====================================

        const existingResult =
            await supabaseClient
                .from("comment_likes")
                .select("id")
                .eq(
                    "comment_id",
                    commentId
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();


        if (existingResult.error) {

            throw new Error(
                existingResult.error.message
            );

        }


        // ====================================
        // 이미 좋아요한 경우 → 취소
        // ====================================

        if (existingResult.data) {

            const deleteResult =
                await supabaseClient
                    .from("comment_likes")
                    .delete()
                    .eq(
                        "id",
                        existingResult.data.id
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    );


            if (deleteResult.error) {

                throw new Error(
                    deleteResult.error.message
                );

            }

        }

        // ====================================
        // 좋아요하지 않은 경우 → 추가
        // ====================================

        else {

            const insertResult =
                await supabaseClient
                    .from("comment_likes")
                    .insert({

                        comment_id:
                            commentId,

                        user_id:
                            currentUser.id

                    });


            if (insertResult.error) {

                // 혹시 중복 좋아요라면
                // 이미 눌린 것으로 처리

                if (
                    insertResult.error.code !==
                    "23505"
                ) {

                    throw new Error(
                        insertResult.error.message
                    );

                }

            }

        }


        // ====================================
        // 변경된 좋아요 정보 다시 가져오기
        // ====================================

        const likesResult =
            await supabaseClient
                .from("comment_likes")
                .select(
                    "id, user_id"
                )
                .eq(
                    "comment_id",
                    commentId
                );


        if (likesResult.error) {

            throw new Error(
                likesResult.error.message
            );

        }


        const likes =
            likesResult.data || [];


        const likeCount =
            likes.length;


        const likedByMe =
            likes.some(
                function (like) {

                    return (
                        like.user_id ===
                        currentUser.id
                    );

                }
            );



        // ====================================
        // 화면 업데이트
        // ====================================

        if (countElement) {

            countElement.textContent =
                likeCount;

        }


        if (button) {

            button.classList.toggle(
                "liked",
                likedByMe
            );


            const icon =
                button.querySelector(
                    ".comment-like-icon"
                );


            if (icon) {

                icon.textContent =
                    likedByMe
                        ? "❤️"
                        : "♡";

            }

        }


    } catch (error) {

        console.error(
            "댓글 좋아요 처리 오류:",
            error
        );


        alert(
            "좋아요 처리 중 오류가 발생했습니다.\n\n" +
            error.message
        );

    } finally {

        likingComments.delete(
            commentId
        );

    }

}



// ========================================
// 댓글 등록
// ========================================

async function submitComment() {

    if (!currentUser) {

        alert(
            "댓글을 작성하려면 로그인하세요."
        );

        return;

    }



    const input =
        document.getElementById(
            "comment-input"
        );


    const button =
        document.getElementById(
            "comment-submit-button"
        );


    const content =
        input.value.trim();



    // =====================================
    // 빈 댓글
    // =====================================

    if (!content) {

        alert(
            "댓글 내용을 입력해주세요."
        );

        input.focus();

        return;

    }



    // =====================================
    // 등록 중
    // =====================================

    button.disabled =
        true;

    button.textContent =
        "등록 중...";



    const result =
        await supabaseClient
            .from("episode_comments")
            .insert({

                episode_id:
                    episodeId,

                user_id:
                    currentUser.id,

                content:
                    content

            });



    if (result.error) {

        console.error(
            "댓글 등록 오류:",
            result.error
        );


        alert(
            "댓글 등록에 실패했습니다."
        );


        button.disabled =
            false;

        button.textContent =
            "댓글 등록";

        return;

    }



    // =====================================
    // 입력창 초기화
    // =====================================

    input.value = "";


    button.disabled =
        false;

    button.textContent =
        "댓글 등록";



    // =====================================
    // 댓글 다시 불러오기
    // =====================================

    await loadComments();

}



// ========================================
// 댓글 삭제
// ========================================

async function deleteComment(
    commentId
) {

    if (!currentUser) {

        return;

    }



    const confirmed =
        confirm(
            "이 댓글을 삭제하시겠습니까?"
        );


    if (!confirmed) {

        return;

    }



    const result =
        await supabaseClient
            .from("episode_comments")
            .delete()
            .eq(
                "id",
                commentId
            )
            .eq(
                "user_id",
                currentUser.id
            );



    if (result.error) {

        console.error(
            "댓글 삭제 오류:",
            result.error
        );


        alert(
            "댓글 삭제에 실패했습니다."
        );

        return;

    }



    await loadComments();

}



// ========================================
// 회차 불러오기
// ========================================

async function loadEpisode() {

    const contentElement =
        document.getElementById(
            "episode-content"
        );


    // =====================================
    // 로그인 사용자 확인
    // =====================================

    await loadCurrentUser();



    // =====================================
    // ID가 없는 경우
    // =====================================

    if (!episodeId) {

        contentElement.textContent =
            "회차 정보를 찾을 수 없습니다.";

        return;

    }



    // =====================================
    // 현재 회차 가져오기
    // =====================================

    const episodeResult =
        await supabaseClient
            .from("novel_episodes")
            .select(`
                id,
                novel_id,
                episode_number,
                title,
                content,
                created_at,
                novels (
                    title,
                    status
                )
            `)
            .eq(
                "id",
                episodeId
            )
            .single();



    if (episodeResult.error) {

        console.error(
            "회차 불러오기 오류:",
            episodeResult.error
        );


        contentElement.innerHTML = `

            <div class="episode-read-error">

                회차를 불러오지 못했습니다.

            </div>

        `;

        return;

    }



    const episode =
        episodeResult.data;



    // =====================================
    // 작품 공개 여부 확인
    // =====================================

    if (
        !episode.novels ||
        episode.novels.status !== "published"
    ) {

        contentElement.innerHTML = `

            <div class="episode-read-error">

                공개되지 않은 작품입니다.

            </div>

        `;

        return;

    }



    const novelTitle =
        episode.novels.title;



    // =====================================
    // 화면에 정보 표시
    // =====================================

    document.title =
        episode.title +
        " - " +
        novelTitle +
        " - NOVEL";



    document.getElementById(
        "novel-title"
    ).textContent =
        novelTitle;



    document.getElementById(
        "episode-number"
    ).textContent =
        episode.episode_number +
        "화";



    document.getElementById(
        "episode-title"
    ).textContent =
        episode.title;



    document.getElementById(
        "episode-date"
    ).textContent =
        new Date(
            episode.created_at
        ).toLocaleDateString(
            "ko-KR"
        );



    // =====================================
    // 작품 페이지 연결
    // =====================================

    document.getElementById(
        "novel-title"
    ).href =
        "novel.html?id=" +
        episode.novel_id;



    // =====================================
    // 본문 표시
    // =====================================

    document.getElementById(
        "episode-content"
    ).innerHTML =
        escapeHTML(
            episode.content
        ).replace(
            /\n/g,
            "<br>"
        );



    // =====================================
    // 회차 목록 연결
    // =====================================

    document.getElementById(
        "episode-list"
    ).href =
        "episode.html?novel_id=" +
        episode.novel_id;



    // =====================================
    // 이전 회차 찾기
    // =====================================

    const previousResult =
        await supabaseClient
            .from("novel_episodes")
            .select(
                "id, episode_number"
            )
            .eq(
                "novel_id",
                episode.novel_id
            )
            .lt(
                "episode_number",
                episode.episode_number
            )
            .order(
                "episode_number",
                {
                    ascending: false
                }
            )
            .limit(1);



    if (
        !previousResult.error &&
        previousResult.data.length > 0
    ) {

        const previousEpisode =
            previousResult.data[0];


        const previousButton =
            document.getElementById(
                "previous-episode"
            );


        previousButton.href =
            "episode-read.html?id=" +
            previousEpisode.id;

    } else {

        const previousButton =
            document.getElementById(
                "previous-episode"
            );


        previousButton.classList.add(
            "episode-nav-disabled"
        );


        previousButton.removeAttribute(
            "href"
        );


        previousButton.textContent =
            "첫 화입니다";

    }



    // =====================================
    // 다음 회차 찾기
    // =====================================

    const nextResult =
        await supabaseClient
            .from("novel_episodes")
            .select(
                "id, episode_number"
            )
            .eq(
                "novel_id",
                episode.novel_id
            )
            .gt(
                "episode_number",
                episode.episode_number
            )
            .order(
                "episode_number",
                {
                    ascending: true
                }
            )
            .limit(1);



    if (
        !nextResult.error &&
        nextResult.data.length > 0
    ) {

        const nextEpisode =
            nextResult.data[0];


        const nextButton =
            document.getElementById(
                "next-episode"
            );


        nextButton.href =
            "episode-read.html?id=" +
            nextEpisode.id;

    } else {

        const nextButton =
            document.getElementById(
                "next-episode"
            );


        nextButton.classList.add(
            "episode-nav-disabled"
        );


        nextButton.removeAttribute(
            "href"
        );


        nextButton.textContent =
            "마지막 화입니다";

    }



    // =====================================
    // 댓글 불러오기
    // =====================================

    await loadComments();

}



// ========================================
// 시작
// ========================================

loadEpisode();


</script>


</body>

</html>
