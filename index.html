<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVEL - 웹소설 플랫폼</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- NOVEL Supabase -->
    <script src="js/supabase.js"></script>

</head>


<body>


<!-- ========================================
     헤더
======================================== -->

<header>

    <div class="header-inner">

        <!-- 로고 -->

        <a
            href="index.html"
            class="logo"
        >
            NOVEL
        </a>


        <!-- 메뉴 -->

        <nav>

            <a href="novels.html">
                소설
            </a>

            <a href="search.html">
                검색
            </a>

        </nav>


        <!-- 오른쪽 메뉴 -->

        <div class="header-right">

            <a
                href="search.html"
                class="search-btn"
                aria-label="검색"
            >
                ⌕
            </a>


            <!-- 로그인 메뉴 -->

            <div id="auth-menu">

                <a href="login.html">
                    로그인
                </a>

            </div>

        </div>

    </div>

</header>



<!-- ========================================
     메인
======================================== -->

<main>

    <section class="hero">

        <div>

            <p class="hero-small">
                NOVEL ORIGINAL
            </p>


            <h1>
                새로운 이야기를<br>
                만나보세요.
            </h1>


            <p class="hero-description">
                다양한 작가들의 이야기를
                한곳에서 만나보세요.
            </p>


            <a
                href="novels.html"
                class="main-btn"
            >
                소설 둘러보기
            </a>

        </div>

    </section>

</main>



<!-- ========================================
     푸터
======================================== -->

<footer>

    <div class="footer-inner">

        <strong>
            NOVEL
        </strong>


        <p>
            새로운 이야기를 만나는 곳
        </p>


        <small>
            © 2026 NOVEL. All rights reserved.
        </small>

    </div>

</footer>



<script>





// ==================================================
// 로그아웃
// ==================================================

function setupLogout() {

    const logoutButton =
        document.getElementById(
            "logout-button"
        );


    if (!logoutButton) {
        return;
    }


    // 중복 이벤트 방지

    if (
        logoutButton.dataset.logoutReady === "true"
    ) {

        return;

    }


    logoutButton.dataset.logoutReady =
        "true";


    logoutButton.addEventListener(
        "click",
        async function () {

            logoutButton.disabled =
                true;


            logoutButton.textContent =
                "로그아웃 중...";


            try {

                const result =
                    await supabaseClient
                        .auth
                        .signOut();


                if (result.error) {

                    throw new Error(
                        result.error.message
                    );

                }


                window.location.reload();


            } catch (error) {

                console.error(
                    "로그아웃 오류:",
                    error
                );


                alert(
                    "로그아웃 중 오류가 발생했습니다.\n\n" +
                    error.message
                );


                logoutButton.disabled =
                    false;


                logoutButton.textContent =
                    "로그아웃";

            }

        }
    );

}



// ==================================================
// 로그인 상태 확인
// ==================================================

async function updateAuthMenu() {

    try {

        // ========================================
        // 현재 로그인 사용자 확인
        // ========================================

        const userResult =
            await supabaseClient
                .auth
                .getUser();


        const user =
            userResult.data.user;


        // ========================================
        // 로그아웃 상태
        // ========================================

        if (!user) {

            authMenu.innerHTML = `

                <a href="login.html">
                    로그인
                </a>

            `;


            return;

        }


        // ========================================
        // 프로필 가져오기
        // ========================================

        const profileResult =
            await supabaseClient
                .from("profiles")
                .select(
                    "nickname, role, writer_status"
                )
                .eq(
                    "id",
                    user.id
                )
                .single();


        // ========================================
        // 프로필 오류
        // ========================================

        if (profileResult.error) {

            console.error(
                "프로필 확인 실패:",
                profileResult.error
            );


            authMenu.innerHTML = `

                <div class="user-menu">

                    <a href="account.html">
                        내 계정
                    </a>


                    <button
                        id="notification-button"
                        type="button"
                    >
                        🔔 알림 받기
                    </button>


                    <button
                        id="logout-button"
                        type="button"
                    >
                        로그아웃
                    </button>

                </div>

            `;


            await setupNotification();

            setupLogout();


            return;

        }


        const profile =
            profileResult.data;


        // ========================================
        // 기본 메뉴
        // ========================================

        let menuHTML = `

            <div class="user-menu">

                <a href="account.html">
                    내 계정
                </a>


                <button
                    id="notification-button"
                    type="button"
                >
                    🔔 알림 받기
                </button>

        `;


        // ========================================
        // 작가 페이지
        // ========================================

        if (
            profile.role === "writer" &&
            profile.writer_status === "approved"
        ) {

            menuHTML += `

                <a href="writer.html">
                    작가 페이지
                </a>

            `;

        }


        // ========================================
        // 관리자 페이지
        // ========================================

        if (
            profile.role === "admin"
        ) {

            menuHTML += `

                <a href="admin.html">
                    관리자 페이지
                </a>

            `;

        }


        // ========================================
        // 로그아웃
        // ========================================

        menuHTML += `

                <button
                    id="logout-button"
                    type="button"
                >
                    로그아웃
                </button>

            </div>

        `;


        // ========================================
        // 메뉴 적용
        // ========================================

        authMenu.innerHTML =
            menuHTML;


        // ========================================
        // 기능 연결
        // ========================================

        await setupNotification();

        setupLogout();


    } catch (error) {

        console.error(
            "로그인 상태 확인 실패:",
            error
        );


        authMenu.innerHTML = `

            <a href="login.html">
                로그인
            </a>

        `;

    }

}



// ==================================================
// 페이지 시작
// ==================================================

updateAuthMenu();


</script>


</body>

</html>
