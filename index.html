<!DOCTYPE html>
<html lang="ko">

    <script src="js/supabase.js"></script>

<body>


<!-- ========================================

<header>

<!-- ========================================
     메인
======================================== -->

<main>

    <section class="hero">

            <h1>
                새로운 이야기를<br>

            <p class="hero-description">
                다양한 작가들의 이야기를
                한곳에서 만나보세요.
            </p>


            <a
                href="novels.html"
                class="main-btn"
            >

            </a>

</main>



<!-- ========================================
     푸터
======================================== -->

<footer>

    <div class="footer-inner">

        <strong>
            NOVEL
        </strong>

        <p>
            새로운 이야기를 만나는 곳
        </p>

        <small>
            © 2026 NOVEL. All rights reserved.
        </small>

    </div>

</footer>



<script>


// ========================================
// VAPID PUBLIC KEY
// ========================================

const VAPID_PUBLIC_KEY =
    "BEVT4m3Oa0gcx8izimQeZ1td1dkYQ2ASWGKpIcVigccBFs14LiNP6ucE1jxYrA8Aakqeba5xcW7L1kZoLm1fTiA";



// ========================================
// 로그인 메뉴
// ========================================

const authMenu =
    document.getElementById("auth-menu");



// ========================================
// Base64 → Uint8Array
// ========================================

function urlBase64ToUint8Array(base64String) {

    const padding =
        "=".repeat(
            (4 - (base64String.length % 4)) % 4
        );


    const base64 =
        (
            base64String +
            padding
        )
        .replace(/-/g, "+")
        .replace(/_/g, "/");


    const rawData =
        window.atob(base64);


    return Uint8Array.from(
        [...rawData].map(
            char => char.charCodeAt(0)
        )
    );

}



// ========================================
// Service Worker 등록
// ========================================

async function registerServiceWorker() {

    if (!("serviceWorker" in navigator)) {

        throw new Error(
            "이 브라우저는 Service Worker를 지원하지 않습니다."
        );

    }


    const registration =
        await navigator.serviceWorker.register(
            "sw.js"
        );


    console.log(
        "NOVEL Service Worker 등록 완료:",
        registration
    );


    await navigator.serviceWorker.ready;


    return registration;

}



// ========================================
// 알림 설정
// ========================================

async function setupNotification() {

    const notificationButton =
        document.getElementById(
            "notification-button"
        );


    if (!notificationButton) {
        return;
    }


    // 알림 지원 여부

    if (!("Notification" in window)) {

        notificationButton.textContent =
            "🔕 알림 미지원";

        notificationButton.disabled =
            true;

        return;

    }


    // Push API 지원 여부

    if (!("PushManager" in window)) {

        notificationButton.textContent =
            "🔕 푸시 미지원";

        notificationButton.disabled =
            true;

        return;

    }


    // 이미 차단된 경우

    if (
        Notification.permission === "denied"
    ) {

        notificationButton.textContent =
            "🔕 알림 차단됨";

        return;

    }


    // 이미 허용된 경우

    if (
        Notification.permission === "granted"
    ) {

        notificationButton.textContent =
            "🔔 알림 켜기";

    } else {

        notificationButton.textContent =
            "🔔 알림 받기";

    }


    // 버튼 클릭

    notificationButton.addEventListener(
        "click",
        async function () {

            notificationButton.disabled =
                true;

            notificationButton.textContent =
                "알림 설정 중...";


            try {

                // ========================================
                // 알림 권한 요청
                // ========================================

                const permission =
                    await Notification.requestPermission();


                if (
                    permission !== "granted"
                ) {

                    notificationButton.textContent =
                        "🔕 알림 차단됨";

                    notificationButton.disabled =
                        false;

                    return;

                }


                // ========================================
                // Service Worker
                // ========================================

                const registration =
                    await registerServiceWorker();


                // ========================================
                // 기존 구독 확인
                // ========================================

                let subscription =
                    await registration
                        .pushManager
                        .getSubscription();


                // ========================================
                // 구독이 없으면 새로 생성
                // ========================================

                if (!subscription) {

                    subscription =
                        await registration
                            .pushManager
                            .subscribe({

                                userVisibleOnly: true,

                                applicationServerKey:
                                    urlBase64ToUint8Array(
                                        VAPID_PUBLIC_KEY
                                    )

                            });

                }


                console.log(
                    "Push Subscription:",
                    subscription
                );


                // ========================================
                // 현재 로그인한 사용자 확인
                // ========================================

                const userResult =
                    await supabaseClient
                        .auth
                        .getUser();


                const user =
                    userResult.data.user;


                if (!user) {

                    throw new Error(
                        "로그인 상태를 확인할 수 없습니다."
                    );

                }


                // ========================================
                // Subscription 정보
                // ========================================

                const subscriptionJSON =
                    subscription.toJSON();


                const endpoint =
                    subscription.endpoint;


                const p256dh =
                    subscriptionJSON.keys?.p256dh;


                const auth =
                    subscriptionJSON.keys?.auth;


                if (
                    !endpoint ||
                    !p256dh ||
                    !auth
                ) {

                    throw new Error(
                        "푸시 구독 정보를 가져오지 못했습니다."
                    );

                }


                // ========================================
                // Supabase 저장
                // ========================================

                const saveResult =
                    await supabaseClient
                        .from("push_subscriptions")
                        .upsert(
                            {
                                user_id:
                                    user.id,

                                endpoint:
                                    endpoint,

                                p256dh:
                                    p256dh,

                                auth:
                                    auth
                            },
                            {
                                onConflict:
                                    "user_id,endpoint"
                            }
                        );


                if (saveResult.error) {

                    console.error(
                        "푸시 구독 저장 실패:",
                        saveResult.error
                    );


                    throw new Error(
                        saveResult.error.message
                    );

                }


                // ========================================
                // 완료
                // ========================================

                notificationButton.textContent =
                    "🔔 알림 켜짐";


                alert(
                    "스마트폰 푸시 알림 등록이 완료되었습니다!"
                );


            } catch (error) {

                console.error(
                    "푸시 알림 설정 오류:",
                    error
                );


                notificationButton.textContent =
                    "🔔 알림 받기";


                alert(
                    "알림 설정 중 오류가 발생했습니다.\n\n" +
                    error.message
                );

            }


            notificationButton.disabled =
                false;

        }
    );

}



// ========================================
// 로그아웃
// ========================================

function setupLogout() {

    const logoutButton =
        document.getElementById(
            "logout-button"
        );


    if (!logoutButton) {
        return;
    }


    logoutButton.addEventListener(
        "click",
        async function () {

            logoutButton.disabled =
                true;

            logoutButton.textContent =
                "로그아웃 중...";


            try {

                const result =
                    await supabaseClient
                        .auth
                        .signOut();


                if (result.error) {

                    alert(
                        "로그아웃 실패: " +
                        result.error.message
                    );


                    logoutButton.disabled =
                        false;

                    logoutButton.textContent =
                        "로그아웃";

                    return;

                }


                window.location.reload();

            } catch (error) {

                console.error(
                    "로그아웃 오류:",
                    error
                );


                alert(
                    "로그아웃 중 오류가 발생했습니다."
                );


                logoutButton.disabled =
                    false;

                logoutButton.textContent =
                    "로그아웃";

            }

        }
    );

}



// ========================================
// 로그인 상태 확인
// ========================================

async function updateAuthMenu() {

    try {

        const userResult =
            await supabaseClient
                .auth
                .getUser();


        const user =
            userResult.data.user;


        // ========================================
        // 로그아웃 상태
        // ========================================

        if (!user) {

            authMenu.innerHTML = `
                <a href="login.html">
                    로그인
                </a>
            `;

            return;

        }


        // ========================================
        // 프로필 가져오기
        // ========================================

        const profileResult =
            await supabaseClient
                .from("profiles")
                .select(
                    "nickname, role, writer_status"
                )
                .eq("id", user.id)
                .single();


        // ========================================
        // 프로필 오류
        // ========================================

        if (profileResult.error) {

            console.error(
                "프로필 확인 실패:",
                profileResult.error
            );


            authMenu.innerHTML = `
                <div class="user-menu">

                    <a href="account.html">
                        내 계정
                    </a>

                    <button
                        id="notification-button"
                        type="button"
                    >
                        🔔 알림 받기
                    </button>

                    <button
                        id="logout-button"
                        type="button"
                    >
                        로그아웃
                    </button>

                </div>
            `;


            setupNotification();

            setupLogout();

            return;

        }


        const profile =
            profileResult.data;


        // ========================================
        // 사용자 메뉴
        // ========================================

        let menuHTML = `

            <div class="user-menu">

                <a href="account.html">
                    내 계정
                </a>

                <button
                    id="notification-button"
                    type="button"
                >
                    🔔 알림 받기
                </button>

        `;


        // ========================================
        // 작가 페이지
        // ========================================

        if (
            profile.role === "writer" &&
            profile.writer_status === "approved"
        ) {

            menuHTML += `
                <a href="writer.html">
                    작가 페이지
                </a>
            `;

        }


        // ========================================
        // 관리자 페이지
        // ========================================

        if (
            profile.role === "admin"
        ) {

            menuHTML += `
                <a href="admin.html">
                    관리자 페이지
                </a>
            `;

        }


        // ========================================
        // 로그아웃 버튼
        // ========================================

        menuHTML += `

                <button
                    id="logout-button"
                    type="button"
                >
                    로그아웃
                </button>

            </div>

        `;


        authMenu.innerHTML =
            menuHTML;


        // ========================================
        // 기능 연결
        // ========================================

        setupNotification();

        setupLogout();


    } catch (error) {

        console.error(
            "로그인 상태 확인 실패:",
            error
        );


        authMenu.innerHTML = `
            <a href="login.html">
                로그인
            </a>
        `;

    }

}



// ========================================
// 페이지 실행
// ========================================

updateAuthMenu();


</script>


</body>
