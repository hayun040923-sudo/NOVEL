<body>

<!-- ========================================

======================================== -->

<main>

                한곳에서 만나보세요.

</main>



<!-- ========================================
     푸터
======================================== -->

<footer>

    <div class="footer-inner">

        <strong>
            NOVEL
        </strong>


        <p>
            새로운 이야기를 만나는 곳
        </p>


        <small>
            © 2026 NOVEL. All rights reserved.
        </small>

    </div>

</footer>



<script>


// ==================================================
// VAPID PUBLIC KEY
// ==================================================

const VAPID_PUBLIC_KEY =
    "BEVT4m3Oa0gcx8izimQeZ1td1dkYQ2ASWGKpIcVigccBFs14LiNP6ucE1jxYrA8Aakqeba5xcW7L1kZoLm1fTiA";



// ==================================================
// 인증 메뉴
// ==================================================

const authMenu =
    document.getElementById("auth-menu");



// ==================================================
// Base64 → Uint8Array
// ==================================================

function urlBase64ToUint8Array(base64String) {

    const padding =
        "=".repeat(
            (4 - (base64String.length % 4)) % 4
        );


    const base64 =
        (
            base64String +
            padding
        )
        .replace(/-/g, "+")
        .replace(/_/g, "/");


    const rawData =
        window.atob(base64);


    return Uint8Array.from(
        [...rawData].map(
            char => char.charCodeAt(0)
        )
    );

}



// ==================================================
// Service Worker 등록
// ==================================================

async function registerServiceWorker() {

    if (!("serviceWorker" in navigator)) {

        throw new Error(
            "이 브라우저는 Service Worker를 지원하지 않습니다."
        );

    }


    const registration =
        await navigator.serviceWorker.register(
            "sw.js"
        );


    console.log(
        "NOVEL Service Worker 등록 완료:",
        registration
    );


    await navigator.serviceWorker.ready;


    return registration;

}



// ==================================================
// 현재 Push Subscription 가져오기
// ==================================================

async function getPushSubscription() {

    const registration =
        await registerServiceWorker();


    const subscription =
        await registration
            .pushManager
            .getSubscription();


    return subscription;

}



// ==================================================
// 알림 버튼 상태 업데이트
// ==================================================

async function updateNotificationButton() {

    const button =
        document.getElementById(
            "notification-button"
        );


    if (!button) {
        return;
    }


    // 알림 미지원

    if (!("Notification" in window)) {

        button.textContent =
            "🔕 알림 미지원";

        button.disabled =
            true;

        return;

    }


    // Push 미지원

    if (!("PushManager" in window)) {

        button.textContent =
            "🔕 푸시 미지원";

        button.disabled =
            true;

        return;

    }


    // 권한 차단

    if (
        Notification.permission === "denied"
    ) {

        button.textContent =
            "🔕 알림 차단됨";

        button.disabled =
            false;

        return;

    }


    try {

        const subscription =
            await getPushSubscription();


        // 이미 구독되어 있음

        if (subscription) {

            button.textContent =
                "🔔 알림 켜짐";

        } else {

            button.textContent =
                "🔔 알림 받기";

        }

    } catch (error) {

        console.error(
            "알림 상태 확인 실패:",
            error
        );


        button.textContent =
            "🔔 알림 받기";

    }

}



// ==================================================
// Supabase에 Push Subscription 저장
// ==================================================

async function savePushSubscription(
    subscription,
    user
) {

    const subscriptionJSON =
        subscription.toJSON();


    const endpoint =
        subscription.endpoint;


    const p256dh =
        subscriptionJSON.keys?.p256dh;


    const auth =
        subscriptionJSON.keys?.auth;


    if (
        !endpoint ||
        !p256dh ||
        !auth
    ) {

        throw new Error(
            "푸시 구독 정보를 가져오지 못했습니다."
        );

    }


    const result =
        await supabaseClient
            .from("push_subscriptions")
            .upsert(
                {
                    user_id:
                        user.id,

                    endpoint:
                        endpoint,

                    p256dh:
                        p256dh,

                    auth:
                        auth
                },
                {
                    onConflict:
                        "user_id,endpoint"
                }
            );


    if (result.error) {

        throw new Error(
            result.error.message
        );

    }

}



// ==================================================
// 알림 설정
// ==================================================

async function setupNotification() {

    const button =
        document.getElementById(
            "notification-button"
        );


    if (!button) {
        return;
    }


    // 처음 상태 확인

    await updateNotificationButton();


    // 이미 이벤트가 연결된 경우 방지

    if (
        button.dataset.notificationReady === "true"
    ) {

        return;

    }


    button.dataset.notificationReady =
        "true";


    // ==================================================
    // 버튼 클릭
    // ==================================================

    button.addEventListener(
        "click",
        async function () {

            // 이미 작업 중이면 무시

            if (button.disabled) {
                return;
            }


            button.disabled =
                true;


            button.textContent =
                "알림 설정 중...";


            try {

                // ==================================================
                // 로그인 확인
                // ==================================================

                const userResult =
                    await supabaseClient
                        .auth
                        .getUser();


                const user =
                    userResult.data.user;


                if (!user) {

                    alert(
                        "로그인이 필요합니다."
                    );

                    window.location.href =
                        "login.html";

                    return;

                }


                // ==================================================
                // 알림 권한 확인
                // ==================================================

                let permission =
                    Notification.permission;


                if (
                    permission !== "granted"
                ) {

                    permission =
                        await Notification.requestPermission();

                }


                if (
                    permission !== "granted"
                ) {

                    button.textContent =
                        "🔕 알림 차단됨";

                    return;

                }


                // ==================================================
                // Service Worker
                // ==================================================

                const registration =
                    await registerServiceWorker();


                // ==================================================
                // 기존 Subscription 확인
                // ==================================================

                let subscription =
                    await registration
                        .pushManager
                        .getSubscription();


                // ==================================================
                // 이미 구독되어 있다면
                // ==================================================

                if (subscription) {

                    console.log(
                        "기존 Push Subscription 사용"
                    );


                    // 혹시 DB에 저장되지 않았을 경우를
                    // 대비하여 다시 저장

                    await savePushSubscription(
                        subscription,
                        user
                    );


                    button.textContent =
                        "🔔 알림 켜짐";


                    return;

                }


                // ==================================================
                // 새 Subscription 생성
                // ==================================================

                console.log(
                    "새 Push Subscription 생성"
                );


                subscription =
                    await registration
                        .pushManager
                        .subscribe({

                            userVisibleOnly:
                                true,

                            applicationServerKey:
                                urlBase64ToUint8Array(
                                    VAPID_PUBLIC_KEY
                                )

                        });


                console.log(
                    "Push Subscription 생성 완료:",
                    subscription
                );


                // ==================================================
                // Supabase 저장
                // ==================================================

                await savePushSubscription(
                    subscription,
                    user
                );


                // ==================================================
                // 완료
                // ==================================================

                button.textContent =
                    "🔔 알림 켜짐";


                alert(
                    "스마트폰 푸시 알림 등록이 완료되었습니다!"
                );


            } catch (error) {

                console.error(
                    "푸시 알림 설정 오류:",
                    error
                );


                // 다시 현재 상태 확인

                try {

                    const subscription =
                        await getPushSubscription();


                    if (subscription) {

                        button.textContent =
                            "🔔 알림 켜짐";

                    } else {

                        button.textContent =
                            "🔔 알림 받기";

                    }

                } catch {

                    button.textContent =
                        "🔔 알림 받기";

                }


                alert(
                    "알림 설정 중 오류가 발생했습니다.\n\n" +
                    error.message
                );

            }


            button.disabled =
                false;

        }
    );

}



// ==================================================
// 로그아웃
// ==================================================

function setupLogout() {

    const logoutButton =
        document.getElementById(
            "logout-button"
        );


    if (!logoutButton) {
        return;
    }


    if (
        logoutButton.dataset.logoutReady === "true"
    ) {

        return;

    }


    logoutButton.dataset.logoutReady =
        "true";


    logoutButton.addEventListener(
        "click",
        async function () {

            logoutButton.disabled =
                true;


            logoutButton.textContent =
                "로그아웃 중...";


            try {

                const result =
                    await supabaseClient
                        .auth
                        .signOut();


                if (result.error) {

                    throw new Error(
                        result.error.message
                    );

                }


                window.location.reload();


            } catch (error) {

                console.error(
                    "로그아웃 오류:",
                    error
                );


                alert(
                    "로그아웃 중 오류가 발생했습니다.\n\n" +
                    error.message
                );


                logoutButton.disabled =
                    false;


                logoutButton.textContent =
                    "로그아웃";

            }

        }
    );

}



// ==================================================
// 로그인 상태 확인
// ==================================================

async function updateAuthMenu() {

    try {

        // ==================================================
        // 현재 사용자
        // ==================================================

        const userResult =
            await supabaseClient
                .auth
                .getUser();


        const user =
            userResult.data.user;


        // ==================================================
        // 로그아웃 상태
        // ==================================================

        if (!user) {

            authMenu.innerHTML = `

                <a href="login.html">
                    로그인
                </a>

            `;

            return;

        }


        // ==================================================
        // 프로필 가져오기
        // ==================================================

        const profileResult =
            await supabaseClient
                .from("profiles")
                .select(
                    "nickname, role, writer_status"
                )
                .eq(
                    "id",
                    user.id
                )
                .single();


        // ==================================================
        // 프로필 오류
        // ==================================================

        if (profileResult.error) {

            console.error(
                "프로필 확인 실패:",
                profileResult.error
            );


            authMenu.innerHTML = `

                <div class="user-menu">

                    <a href="account.html">
                        내 계정
                    </a>


                    <button
                        id="notification-button"
                        type="button"
                    >
                        🔔 알림 받기
                    </button>


                    <button
                        id="logout-button"
                        type="button"
                    >
                        로그아웃
                    </button>

                </div>

            `;


            await setupNotification();

            setupLogout();

            return;

        }


        const profile =
            profileResult.data;


        // ==================================================
        // 기본 사용자 메뉴
        // ==================================================

        let menuHTML = `

            <div class="user-menu">

                <a href="account.html">
                    내 계정
                </a>


                <button
                    id="notification-button"
                    type="button"
                >
                    🔔 알림 받기
                </button>

        `;


        // ==================================================
        // 작가 페이지
        // ==================================================

        if (
            profile.role === "writer" &&
            profile.writer_status === "approved"
        ) {

            menuHTML += `

                <a href="writer.html">
                    작가 페이지
                </a>

            `;

        }


        // ==================================================
        // 관리자 페이지
        // ==================================================

        if (
            profile.role === "admin"
        ) {

            menuHTML += `

                <a href="admin.html">
                    관리자 페이지
                </a>

            `;

        }


        // ==================================================
        // 로그아웃
        // ==================================================

        menuHTML += `

                <button
                    id="logout-button"
                    type="button"
                >
                    로그아웃
                </button>

            </div>

        `;


        // ==================================================
        // 메뉴 적용
        // ==================================================

        authMenu.innerHTML =
            menuHTML;


        // ==================================================
        // 기능 연결
        // ==================================================

        await setupNotification();

        setupLogout();


    } catch (error) {

        console.error(
            "로그인 상태 확인 실패:",
            error
        );


        authMenu.innerHTML = `

            <a href="login.html">
                로그인
            </a>

        `;

    }

}



// ==================================================
// 페이지 시작
// ==================================================

updateAuthMenu();


</script>
