<script>


// ==================================================
// VAPID PUBLIC KEY

const VAPID_PUBLIC_KEY =
    "BEVT4m3Oa0gcx8izimQeZ1td1dkYQ2ASWGKpIcVigccBFs14LiNP6ucE1jxYrA8Aakqeba5xcW7L1kZoLm1fTiA";



// ==================================================
// 인증 메뉴

const authMenu =
    document.getElementById("auth-menu");



// ==================================================
// Base64 → Uint8Array
// ==================================================

function urlBase64ToUint8Array(base64String) {

    const padding =
        "=".repeat(
            (4 - (base64String.length % 4)) % 4
        );


    const base64 =
        (
            base64String +
            padding
        )
        .replace(/-/g, "+")
        .replace(/_/g, "/");


    const rawData =
        window.atob(base64);


    return Uint8Array.from(
        [...rawData].map(
            char => char.charCodeAt(0)
        )
    );

}



// ==================================================
// Service Worker 등록
// ==================================================

async function registerServiceWorker() {

    if (!("serviceWorker" in navigator)) {

        throw new Error(
            "이 브라우저는 Service Worker를 지원하지 않습니다."
        );

    }


    const registration =
        await navigator.serviceWorker.register(
            "sw.js"
        );


    console.log(
        "NOVEL Service Worker 등록 완료:",
        registration
    );


    await navigator.serviceWorker.ready;


    return registration;

}



// ==================================================
// 현재 Push Subscription 확인
// ==================================================

async function getPushSubscription() {

    const registration =
        await registerServiceWorker();


    const subscription =
        await registration
            .pushManager
            .getSubscription();


    return subscription;

}



// ==================================================
// 알림 버튼 상태 확인
// ==================================================

async function updateNotificationButton() {

    const button =
        document.getElementById(
            "notification-button"
        );


    if (!button) {
        return;
    }


    // ----------------------------------------
    // Notification 미지원
    // ----------------------------------------

    if (!("Notification" in window)) {

        button.textContent =
            "🔕 알림 미지원";

        button.disabled =
            true;

        return;

    }


    // ----------------------------------------
    // Push API 미지원
    // ----------------------------------------

    if (!("PushManager" in window)) {

        button.textContent =
            "🔕 푸시 미지원";

        button.disabled =
            true;

        return;

    }


    // ----------------------------------------
    // 알림 권한 차단
    // ----------------------------------------

    if (
        Notification.permission === "denied"
    ) {

        button.textContent =
            "🔕 알림 차단됨";

        button.disabled =
            false;

        return;

    }


    try {

        // ----------------------------------------
        // 기존 구독 확인
        // ----------------------------------------

        const subscription =
            await getPushSubscription();


        if (subscription) {

            // 이미 구독됨

            button.textContent =
                "🔔 알림 켜짐";

            // ★ 중요
            // disabled 상태로 만들지 않는다.

            button.disabled =
                false;

        } else {

            // 아직 구독하지 않음

            button.textContent =
                "🔔 알림 받기";

            button.disabled =
                false;

        }

    } catch (error) {

        console.error(
            "알림 상태 확인 실패:",
            error
        );


        button.textContent =
            "🔔 알림 받기";

        button.disabled =
            false;

    }

}



// ==================================================
// Push Subscription을 Supabase에 저장
// ==================================================

async function savePushSubscription(
    subscription,
    user
) {

    const subscriptionJSON =
        subscription.toJSON();


    const endpoint =
        subscription.endpoint;


    const p256dh =
        subscriptionJSON.keys?.p256dh;


    const auth =
        subscriptionJSON.keys?.auth;


    if (
        !endpoint ||
        !p256dh ||
        !auth
    ) {

        throw new Error(
            "푸시 구독 정보를 가져오지 못했습니다."
        );

    }


    const result =
        await supabaseClient
            .from("push_subscriptions")
            .upsert(
                {
                    user_id:
                        user.id,

                    endpoint:
                        endpoint,

                    p256dh:
                        p256dh,

                    auth:
                        auth
                },
                {
                    onConflict:
                        "user_id,endpoint"
                }
            );


    if (result.error) {

        console.error(
            "푸시 구독 저장 실패:",
            result.error
        );


        throw new Error(
            result.error.message
        );

    }


    console.log(
        "Push Subscription Supabase 저장 완료"
    );

}



// ==================================================
// 알림 설정
// ==================================================

async function setupNotification() {

    const button =
        document.getElementById("notification-button");

    if (!button) {
        return;
    }


    // 중복 실행 방지
    if (button.dataset.notificationReady === "true") {
        return;
    }

    button.dataset.notificationReady = "true";


    // 처리 중인지 확인하는 변수
    let isProcessing = false;


    // ========================================
    // 버튼 상태 확인
    // ========================================

    async function updateButton() {

        // 알림 미지원
        if (!("Notification" in window)) {

            button.textContent = "🔕 알림 미지원";

            button.style.opacity = "1";

            return;
        }


        // Push 미지원
        if (!("PushManager" in window)) {

            button.textContent = "🔕 푸시 미지원";

            button.style.opacity = "1";

            return;
        }


        // 알림 차단
        if (Notification.permission === "denied") {

            button.textContent = "🔕 알림 차단됨";

            button.style.opacity = "1";

            return;
        }


        try {

            const registration =
                await registerServiceWorker();


            const subscription =
                await registration
                    .pushManager
                    .getSubscription();


            if (subscription) {

                button.textContent =
                    "🔔 알림 켜짐";

            } else {

                button.textContent =
                    "🔔 알림 받기";

            }


            // ★ 항상 불투명하게
            button.style.opacity = "1";

            // ★ disabled 속성 제거
            button.disabled = false;

            button.removeAttribute("disabled");

        } catch (error) {

            console.error(
                "알림 상태 확인 실패:",
                error
            );


            button.textContent =
                "🔔 알림 받기";


            button.style.opacity = "1";

            button.disabled = false;

            button.removeAttribute("disabled");

        }

    }


    // 처음 상태 확인
    await updateButton();


    // ========================================
    // 버튼 클릭
    // ========================================

    button.addEventListener(
        "click",
        async function () {

            // 처리 중이면 무시
            if (isProcessing) {
                return;
            }


            isProcessing = true;


            // ★ disabled를 사용하지 않음
            button.style.opacity = "1";


            try {

                // ========================================
                // 로그인 확인
                // ========================================

                const userResult =
                    await supabaseClient
                        .auth
                        .getUser();


                const user =
                    userResult.data.user;


                if (!user) {

                    alert(
                        "알림을 사용하려면 로그인이 필요합니다."
                    );


                    window.location.href =
                        "login.html";


                    return;
                }


                // ========================================
                // 알림 권한 확인
                // ========================================

                if (
                    Notification.permission === "denied"
                ) {

                    button.textContent =
                        "🔕 알림 차단됨";


                    alert(
                        "브라우저에서 NOVEL 알림이 차단되어 있습니다."
                    );


                    return;
                }


                // ========================================
                // Service Worker
                // ========================================

                const registration =
                    await registerServiceWorker();


                // ========================================
                // 기존 구독 확인
                // ========================================

                let subscription =
                    await registration
                        .pushManager
                        .getSubscription();


                // ========================================
                // 이미 구독되어 있음
                // ========================================

                if (subscription) {

                    console.log(
                        "기존 Push Subscription 사용"
                    );


                    // 혹시 DB에 저장되지 않았을 경우 저장
                    await savePushSubscription(
                        subscription,
                        user
                    );


                    button.textContent =
                        "🔔 알림 켜짐";


                    button.style.opacity =
                        "1";


                    alert(
                        "이미 알림이 켜져 있습니다."
                    );


                    return;
                }


                // ========================================
                // 알림 권한 요청
                // ========================================

                let permission =
                    Notification.permission;


                if (
                    permission !== "granted"
                ) {

                    permission =
                        await Notification.requestPermission();

                }


                if (
                    permission !== "granted"
                ) {

                    button.textContent =
                        "🔕 알림 차단됨";


                    return;
                }


                // ========================================
                // 새 Push Subscription 생성
                // ========================================

                button.textContent =
                    "알림 설정 중...";


                button.style.opacity =
                    "1";


                subscription =
                    await registration
                        .pushManager
                        .subscribe({

                            userVisibleOnly:
                                true,

                            applicationServerKey:
                                urlBase64ToUint8Array(
                                    VAPID_PUBLIC_KEY
                                )

                        });


                console.log(
                    "Push Subscription 생성 완료:",
                    subscription
                );


                // ========================================
                // Supabase 저장
                // ========================================

                await savePushSubscription(
                    subscription,
                    user
                );


                // ========================================
                // 완료
                // ========================================

                button.textContent =
                    "🔔 알림 켜짐";


                button.style.opacity =
                    "1";


                alert(
                    "스마트폰 푸시 알림 등록이 완료되었습니다!"
                );


            } catch (error) {

                console.error(
                    "푸시 알림 설정 오류:",
                    error
                );


                button.style.opacity =
                    "1";


                // 현재 구독 상태 다시 확인
                try {

                    const registration =
                        await registerServiceWorker();


                    const subscription =
                        await registration
                            .pushManager
                            .getSubscription();


                    if (subscription) {

                        button.textContent =
                            "🔔 알림 켜짐";

                    } else {

                        button.textContent =
                            "🔔 알림 받기";

                    }

                } catch {

                    button.textContent =
                        "🔔 알림 받기";

                }


                alert(
                    "알림 설정 중 오류가 발생했습니다.\n\n" +
                    error.message
                );

            } finally {

                // ★ 무조건 정상 상태로 복구
                isProcessing = false;

                button.disabled = false;

                button.removeAttribute("disabled");

                button.style.opacity = "1";

            }

        }
    );

}



// ==================================================
// 로그아웃
// ==================================================

function setupLogout() {

    const logoutButton =
        document.getElementById(
            "logout-button"
        );


    if (!logoutButton) {
        return;
    }


    // 중복 이벤트 방지

    if (
        logoutButton.dataset.logoutReady === "true"
    ) {

        return;

    }


    logoutButton.dataset.logoutReady =
        "true";


    logoutButton.addEventListener(
        "click",
        async function () {

            logoutButton.disabled =
                true;


            logoutButton.textContent =
                "로그아웃 중...";


            try {

                const result =
                    await supabaseClient
                        .auth
                        .signOut();


                if (result.error) {

                    throw new Error(
                        result.error.message
                    );

                }


                window.location.reload();


            } catch (error) {

                console.error(
                    "로그아웃 오류:",
                    error
                );


                alert(
                    "로그아웃 중 오류가 발생했습니다.\n\n" +
                    error.message
                );


                logoutButton.disabled =
                    false;


                logoutButton.textContent =
                    "로그아웃";

            }

        }
    );

}



// ==================================================
// 로그인 상태 확인
// ==================================================

async function updateAuthMenu() {

    try {

        // ========================================
        // 현재 로그인 사용자 확인
        // ========================================

        const userResult =
            await supabaseClient
                .auth
                .getUser();


        const user =
            userResult.data.user;


        // ========================================
        // 로그아웃 상태
        // ========================================

        if (!user) {

            authMenu.innerHTML = `

                <a href="login.html">
                    로그인
                </a>

            `;


            return;

        }


        // ========================================
        // 프로필 가져오기
        // ========================================

        const profileResult =
            await supabaseClient
                .from("profiles")
                .select(
                    "nickname, role, writer_status"
                )
                .eq(
                    "id",
                    user.id
                )
                .single();


        // ========================================
        // 프로필 오류
        // ========================================

        if (profileResult.error) {

            console.error(
                "프로필 확인 실패:",
                profileResult.error
            );


            authMenu.innerHTML = `

                <div class="user-menu">

                    <a href="account.html">
                        내 계정
                    </a>


                    <button
                        id="notification-button"
                        type="button"
                    >
                        🔔 알림 받기
                    </button>


                    <button
                        id="logout-button"
                        type="button"
                    >
                        로그아웃
                    </button>

                </div>

            `;


            await setupNotification();

            setupLogout();


            return;

        }


        const profile =
            profileResult.data;


        // ========================================
        // 기본 메뉴
        // ========================================

        let menuHTML = `

            <div class="user-menu">

                <a href="account.html">
                    내 계정
                </a>


                <button
                    id="notification-button"
                    type="button"
                >
                    🔔 알림 받기
                </button>

        `;


        // ========================================
        // 작가 페이지
        // ========================================

        if (
            profile.role === "writer" &&
            profile.writer_status === "approved"
        ) {

            menuHTML += `

                <a href="writer.html">
                    작가 페이지
                </a>

            `;

        }


        // ========================================
        // 관리자 페이지
        // ========================================

        if (
            profile.role === "admin"
        ) {

            menuHTML += `

                <a href="admin.html">
                    관리자 페이지
                </a>

            `;

        }


        // ========================================
        // 로그아웃
        // ========================================

        menuHTML += `

                <button
                    id="logout-button"
                    type="button"
                >
                    로그아웃
                </button>

            </div>

        `;


        // ========================================
        // 메뉴 적용
        // ========================================

        authMenu.innerHTML =
            menuHTML;


        // ========================================
        // 기능 연결
        // ========================================

        await setupNotification();

        setupLogout();


    } catch (error) {

        console.error(
            "로그인 상태 확인 실패:",
            error
        );


        authMenu.innerHTML = `

            <a href="login.html">
                로그인
            </a>

        `;

    }

}



// ==================================================
// 페이지 시작
// ==================================================

updateAuthMenu();


</script>
