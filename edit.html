<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>작품 수정 - NOVEL</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/supabase.js"></script>

</head>


<body>


<header>

    <div class="header-inner">

        <a
            href="index.html"
            class="logo"
        >
            NOVEL
        </a>


        <nav>

            <a href="novels.html">
                소설
            </a>

            <a href="#">
                검색
            </a>
            
            </a>

        </nav>


        <div class="header-right">

            <a href="writer.html">
                작가 페이지
            </a>

        </div>

    </div>

</header>



<main class="write-page">

    <div class="write-box">


        <p class="write-small">
            EDIT NOVEL
        </p>


        <h1>
            작품 수정
        </h1>


        <form id="edit-form">


            <!-- 제목 -->

            <div class="write-field">

                <label for="title">
                    작품 제목
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="작품 제목을 입력하세요"
                    required
                >

            </div>



            <!-- 장르 -->

            <div class="write-field">

                <label for="genre">
                    장르
                </label>

                <input
                    type="text"
                    id="genre"
                    placeholder="예: 판타지, 로맨스, 공포"
                    required
                >

            </div>



            <!-- 작품 소개 -->

            <div class="write-field">

                <label for="description">
                    작품 소개
                </label>

                <textarea
                    id="description"
                    rows="6"
                    placeholder="작품을 소개해주세요."
                ></textarea>

            </div>



            <!-- 표지 -->

            <div class="write-field">

                <label>
                    작품 표지
                </label>


                <div
                    id="current-cover"
                    class="edit-current-cover"
                >

                    기존 표지를 불러오는 중...

                </div>


                <label
                    for="cover"
                    class="cover-select-button"
                >

                    새 표지 선택

                </label>


                <input
                    type="file"
                    id="cover"
                    accept="image/jpeg,image/png,image/webp"
                >


                <p class="cover-help">

                    JPG, PNG, WEBP / 최대 5MB

                </p>


                <div
                    id="cover-preview"
                    class="cover-preview"
                ></div>

            </div>



            <!-- 저장 -->

            <button
                type="submit"
                id="save-button"
                class="write-submit-button"
            >

                저장하기

            </button>


        </form>


        <p
            id="edit-message"
            class="write-message"
        ></p>


    </div>

</main>



<script>


// ========================================
// URL에서 작품 ID 가져오기
// ========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const novelId =
    params.get("id");



// ========================================
// 현재 로그인한 사용자
// ========================================

let currentUser = null;


// 현재 작품 정보
let currentNovel = null;


// 새로 선택한 표지
let selectedCoverFile = null;


// 새 표지 미리보기 URL
let previewUrl = null;



// ========================================
// HTML 보안 처리
// ========================================

function escapeHTML(text) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ========================================
// 로그인 + 작가 권한 확인
// ========================================

async function checkUser() {

    const result =
        await supabaseClient.auth.getUser();


    currentUser =
        result.data.user;


    if (!currentUser) {

        window.location.href =
            "login.html";

        return false;

    }


    const profileResult =
        await supabaseClient

            .from("profiles")

            .select(
                "id, role, writer_status"
            )

            .eq(
                "id",
                currentUser.id
            )

            .single();


    if (
        profileResult.error ||
        !profileResult.data
    ) {

        alert(
            "사용자 정보를 확인할 수 없습니다."
        );

        window.location.href =
            "index.html";

        return false;

    }


    const profile =
        profileResult.data;


    if (
        profile.role !== "writer" ||
        profile.writer_status !== "approved"
    ) {

        alert(
            "승인된 작가만 작품을 수정할 수 있습니다."
        );

        window.location.href =
            "index.html";

        return false;

    }


    return true;

}



// ========================================
// 작품 불러오기
// ========================================

async function loadNovel() {

    const result =
        await supabaseClient

            .from("novels")

            .select(`
                id,
                author_id,
                title,
                genre,
                description,
                cover_url
            `)

            .eq(
                "id",
                novelId
            )

            .single();


    if (result.error) {

        console.error(
            "작품 불러오기 오류:",
            result.error
        );


        alert(
            "작품을 불러오지 못했습니다."
        );


        window.location.href =
            "writer.html";

        return;

    }


    currentNovel =
        result.data;



    // =====================================
    // 본인 작품인지 확인
    // =====================================

    if (
        currentNovel.author_id !==
        currentUser.id
    ) {

        alert(
            "본인의 작품만 수정할 수 있습니다."
        );


        window.location.href =
            "writer.html";

        return;

    }



    // =====================================
    // 입력값 채우기
    // =====================================

    document.getElementById(
        "title"
    ).value =
        currentNovel.title || "";


    document.getElementById(
        "genre"
    ).value =
        currentNovel.genre || "";


    document.getElementById(
        "description"
    ).value =
        currentNovel.description || "";



    // =====================================
    // 기존 표지 표시
    // =====================================

    const currentCover =
        document.getElementById(
            "current-cover"
        );


    if (currentNovel.cover_url) {

        currentCover.innerHTML = `

            <img
                src="${escapeHTML(
                    currentNovel.cover_url
                )}"
                alt="현재 작품 표지"
            >

        `;

    } else {

        currentCover.innerHTML = `

            <div class="edit-no-cover">

                NOVEL

            </div>

        `;

    }



    document.title =
        currentNovel.title +
        " 수정 - NOVEL";

}



// ========================================
// 새 표지 선택
// ========================================

document.getElementById(
    "cover"
).addEventListener(
    "change",
    function () {


        const file =
            this.files[0];


        if (!file) {

            selectedCoverFile =
                null;

            return;

        }



        // =================================
        // 파일 크기
        // =================================

        if (
            file.size >
            5 * 1024 * 1024
        ) {

            alert(
                "표지 이미지는 5MB 이하만 가능합니다."
            );


            this.value = "";

            selectedCoverFile =
                null;

            return;

        }



        // =================================
        // 파일 형식
        // =================================

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];


        if (
            !allowedTypes.includes(
                file.type
            )
        ) {

            alert(
                "JPG, PNG, WEBP 이미지만 사용할 수 있습니다."
            );


            this.value = "";

            selectedCoverFile =
                null;

            return;

        }



        selectedCoverFile =
            file;



        // =================================
        // 기존 미리보기 URL 제거
        // =================================

        if (previewUrl) {

            URL.revokeObjectURL(
                previewUrl
            );

        }


        previewUrl =
            URL.createObjectURL(
                file
            );



        // =================================
        // 미리보기
        // =================================

        const preview =
            document.getElementById(
                "cover-preview"
            );


        preview.innerHTML = `

            <p class="cover-preview-title">

                새 표지 미리보기

            </p>


            <img
                src="${previewUrl}"
                alt="새 표지 미리보기"
            >

        `;

    }
);



// ========================================
// 기존 Storage 파일 경로 추출
// ========================================

function getStoragePath(
    publicUrl
) {

    if (!publicUrl) {

        return null;

    }


    const marker =
        "/storage/v1/object/public/covers/";


    const index =
        publicUrl.indexOf(
            marker
        );


    if (index === -1) {

        return null;

    }


    return decodeURIComponent(
        publicUrl.substring(
            index + marker.length
        )
    );

}



// ========================================
// 새 표지 업로드
// ========================================

async function uploadNewCover() {

    if (!selectedCoverFile) {

        return currentNovel.cover_url;

    }



    const extension =
        selectedCoverFile.name
            .split(".")
            .pop()
            .toLowerCase();


    const fileName =
        currentUser.id +
        "-" +
        Date.now() +
        "." +
        extension;



    // =====================================
    // 업로드
    // =====================================

    const uploadResult =
        await supabaseClient

            .storage

            .from("covers")

            .upload(
                fileName,
                selectedCoverFile,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


    if (uploadResult.error) {

        throw uploadResult.error;

    }



    // =====================================
    // 공개 URL
    // =====================================

    const publicResult =
        supabaseClient

            .storage

            .from("covers")

            .getPublicUrl(
                fileName
            );


    return publicResult
        .data
        .publicUrl;

}



// ========================================
// 작품 저장
// ========================================

document.getElementById(
    "edit-form"
).addEventListener(
    "submit",
    async function (event) {


        event.preventDefault();



        const saveButton =
            document.getElementById(
                "save-button"
            );


        const message =
            document.getElementById(
                "edit-message"
            );



        const title =
            document.getElementById(
                "title"
            ).value.trim();


        const genre =
            document.getElementById(
                "genre"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();



        // =================================
        // 입력 확인
        // =================================

        if (!title) {

            alert(
                "작품 제목을 입력해주세요."
            );

            return;

        }


        if (!genre) {

            alert(
                "장르를 입력해주세요."
            );

            return;

        }



        // =================================
        // 저장 시작
        // =================================

        saveButton.disabled =
            true;


        saveButton.textContent =
            "저장 중...";


        message.textContent =
            "";



        try {


            // =============================
            // 새 표지 업로드
            // =============================

            let newCoverUrl =
                currentNovel.cover_url;


            if (selectedCoverFile) {

                message.textContent =
                    "새 표지를 업로드하는 중...";


                newCoverUrl =
                    await uploadNewCover();

            }



            // =============================
            // 작품 정보 수정
            // =============================

            message.textContent =
                "작품 정보를 저장하는 중...";


            const updateResult =
                await supabaseClient

                    .from("novels")

                    .update({

                        title:
                            title,

                        genre:
                            genre,

                        description:
                            description,

                        cover_url:
                            newCoverUrl,

                        updated_at:
                            new Date()
                                .toISOString()

                    })

                    .eq(
                        "id",
                        novelId
                    )

                    .eq(
                        "author_id",
                        currentUser.id
                    );



            if (updateResult.error) {

                throw updateResult.error;

            }



            // =============================
            // 기존 표지 삭제
            // =============================

            if (
                selectedCoverFile &&
                currentNovel.cover_url
            ) {

                const oldPath =
                    getStoragePath(
                        currentNovel.cover_url
                    );


                if (oldPath) {

                    const deleteResult =
                        await supabaseClient

                            .storage

                            .from("covers")

                            .remove([
                                oldPath
                            ]);


                    if (deleteResult.error) {

                        console.warn(
                            "기존 표지 삭제 실패:",
                            deleteResult.error
                        );

                    }

                }

            }



            // =============================
            // 완료
            // =============================

            message.textContent =
                "저장되었습니다.";


            setTimeout(
                function () {

                    window.location.href =
                        "writer.html";

                },
                700
            );


        } catch (error) {

            console.error(
                "작품 수정 오류:",
                error
            );


            message.textContent =
                "저장하지 못했습니다.";


            alert(
                "작품 수정 실패: " +
                error.message
            );


            saveButton.disabled =
                false;


            saveButton.textContent =
                "저장하기";

        }

    }
);



// ========================================
// 시작
// ========================================

async function start() {

    const allowed =
        await checkUser();


    if (!allowed) {

        return;

    }


    if (!novelId) {

        alert(
            "작품 ID가 없습니다."
        );


        window.location.href =
            "writer.html";

        return;

    }


    await loadNovel();

}


start();

</script>


</body>

</html>
